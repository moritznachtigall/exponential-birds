<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exponential Birds – Parameter a und b</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--panel:#eef3f8;--text:#172033;--muted:#64748b;--border:#cbd5e1;--blue:#2563eb;--blue2:#dbeafe;--red:#ef4444;--green:#22c55e;--yellow:#f59e0b;--brown:#92400e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.top,.status,.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0}.muted{color:var(--muted)}.pill,.card,.task{background:var(--card);border:1px solid var(--border);border-radius:14px}
.pill{padding:8px 11px;font-size:.9rem}.task{padding:13px;margin:14px 0;background:var(--panel)}.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:750}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:15px}@media(max-width:820px){.layout{grid-template-columns:1fr}}
.scene{overflow:hidden;border:1px solid var(--border);border-radius:20px;background:linear-gradient(#dff3ff 0 72%,#d6efc9 72%)}svg{display:block;width:100%;height:auto}
.status{padding:11px 14px;border-top:1px solid var(--border);background:rgba(255,255,255,.9);font-size:.92rem}.side{display:flex;flex-direction:column;gap:11px}.card{padding:13px}
.formula{font-size:1.28rem;font-weight:800;margin-top:4px}label{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem}input[type=range]{width:100%;height:40px}
button{min-height:44px;border:1px solid var(--border);border-radius:11px;background:#fff;font-weight:700;cursor:pointer;padding:9px 12px}button.primary{background:var(--blue2);border-color:#93c5fd}button:disabled{opacity:.4;cursor:not-allowed}
.side button{width:100%}.nav{margin-top:14px}.nav button{min-width:145px}.small{font-size:.83rem}.hidden{display:none}.locked{opacity:.55}.leveldots{display:flex;gap:5px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#cbd5e1}.dot.now{background:#2563eb}.dot.done{background:#22c55e}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Exponential Birds</h1>
      <div class="muted">Übung zu <strong>f(x)=b·a<sup>x</sup></strong></div>
    </div>
    <div class="pill">Level <strong id="levelNo">1</strong> / <strong id="levelTotal">8</strong></div>
  </div>

  <div class="task">
    <div class="top">
      <div>
        <div class="label" id="phase">Wiederholung: Parameter a</div>
        <div id="taskText" style="font-weight:700;margin-top:4px"></div>
      </div>
      <div class="leveldots" id="dots"></div>
    </div>
  </div>

  <div class="layout">
    <section class="scene">
      <svg viewBox="0 0 820 500" aria-label="Koordinatensystem mit Exponentialfunktion">
        <g id="grid"></g>
        <line x1="78" y1="250" x2="770" y2="250" stroke="#334155" stroke-width="2"/>
        <line x1="78" y1="45" x2="78" y2="455" stroke="#334155" stroke-width="2"/>
        <text x="758" y="274" fill="#64748b" font-size="13">x</text>
        <text x="57" y="58" fill="#64748b" font-size="13">y</text>
        <circle cx="700" cy="72" r="30" fill="#facc15" opacity=".55"/>
        <ellipse cx="180" cy="90" rx="78" ry="20" fill="#fff" opacity=".72"/>
        <path d="M0 405 Q150 380 300 407 T600 400 T820 407 L820 500 L0 500Z" fill="#9bd18b" opacity=".65"/>
        <path id="curve" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
        <path id="trail" fill="none" stroke="#64748b" stroke-width="3" opacity=".65"/>
        <circle id="startDot" r="6" fill="#7c3aed"/>
        <g id="target">
          <rect x="-42" y="22" width="84" height="11" rx="4" fill="#92400e"/>
          <circle r="20" fill="#22c55e" stroke="#172033" stroke-width="2"/>
          <circle cx="-7" cy="-4" r="2.5" fill="#172033"/><circle cx="7" cy="-4" r="2.5" fill="#172033"/>
          <ellipse cy="7" rx="9" ry="6" fill="#dcfce7" stroke="#172033"/>
        </g>
        <g id="bird">
          <circle r="18" fill="#ef4444" stroke="#172033" stroke-width="2"/>
          <circle cx="6" cy="-5" r="4" fill="#fff"/><circle cx="7" cy="-5" r="1.5" fill="#172033"/>
          <path d="M16 0 L30 6 L16 10Z" fill="#f59e0b" stroke="#172033"/>
        </g>
      </svg>
      <div class="status">
        <span id="message">Stelle die Parameter ein und starte den Vogel.</span>
        <span>Versuche im Level: <strong id="tries">0</strong></span>
      </div>
    </section>

    <aside class="side">
      <div class="card"><div class="label">Funktion</div><div id="formula" class="formula"></div></div>

      <div class="card" id="aCard">
        <label for="aRange"><span>Parameter a</span><output id="aOut"></output></label>
        <input id="aRange" type="range" min="0.60" max="1.50" step="0.01">
        <div class="small muted">0,60 — 1,50</div>
      </div>

      <div class="card" id="bCard">
        <label for="bRange"><span>Parameter b</span><output id="bOut"></output></label>
        <input id="bRange" type="range" min="-5" max="5" step="0.25">
        <div class="small muted">−5,00 — 5,00</div>
      </div>

      <button class="primary" id="shoot">🐦 Abschießen</button>
      <button id="reset">↻ Level zurücksetzen</button>
    </aside>
  </div>

  <div class="nav">
    <button id="prev">← Vorheriges Level</button>
    <button id="next">Nächstes Level →</button>
  </div>
</div>

<script>
(()=>{
const levels=[
 {phase:"Wiederholung: Parameter a",task:"Verändere a und triff das Ziel.",a:.85,b:1,startA:1.15,startB:1,lockB:true,onlyA:true,x:6.5},
 {phase:"Wiederholung: Parameter a",task:"Verändere a und triff das Ziel.",a:1.12,b:1,startA:.82,startB:1,lockB:true,onlyA:true,x:7.2},
 {phase:"Wiederholung: Parameter a",task:"Verändere a und triff das Ziel.",a:1.30,b:1,startA:1.05,startB:1,lockB:true,onlyA:true,x:6.0},
 {phase:"Parameter b",task:"Verändere nur b und triff das Ziel.",a:1.18,b:2.5,startA:1.18,startB:.5,lockA:true,x:5.3},
 {phase:"Parameter b",task:"Verändere nur b und triff das Ziel.",a:1.18,b:.75,startA:1.18,startB:3.5,lockA:true,x:6.8},
 {phase:"Parameter b",task:"Verändere nur b und triff das Ziel unterhalb der x-Achse.",a:1.12,b:-1.75,startA:1.12,startB:1.5,lockA:true,x:5.5},
 {phase:"Parameter b",task:"Verändere nur b. Der Zielpunkt liegt auf der x-Achse.",a:1.25,b:0,startA:1.25,startB:2,lockA:true,x:7.0},
 {phase:"Parameter b",task:"Verändere nur b und triff das Ziel.",a:.82,b:-4,startA:.82,startB:-1,lockA:true,x:5.8}
];
const plot={left:78,axisY:250,width:692,halfH:190},xmax=10,yScale=10;
const sx=x=>plot.left+x/xmax*plot.width, sy=y=>plot.axisY-y/yScale*plot.halfH;
const fmt=n=>Number(n).toFixed(2).replace(".",",");
const aR=document.getElementById("aRange"),bR=document.getElementById("bRange"),curve=document.getElementById("curve"),trail=document.getElementById("trail"),bird=document.getElementById("bird"),target=document.getElementById("target"),startDot=document.getElementById("startDot");
const msg=document.getElementById("message"),triesEl=document.getElementById("tries"),shoot=document.getElementById("shoot");
let level=0,tries=0,running=false,raf=null;

for(let x=1;x<=10;x++){let px=sx(x);grid.insertAdjacentHTML("beforeend",`<line x1="${px}" y1="45" x2="${px}" y2="455" stroke="#cbd5e1"/><text x="${px}" y="270" text-anchor="middle" fill="#64748b" font-size="10">${x}</text>`)}
for(let y=-10;y<=10;y+=2){if(y===0)continue;let py=sy(y);grid.insertAdjacentHTML("beforeend",`<line x1="78" y1="${py}" x2="770" y2="${py}" stroke="#cbd5e1"/><text x="66" y="${py+3}" text-anchor="end" fill="#64748b" font-size="10">${y}</text>`)}

function f(x,a,b){return b*Math.pow(a,x)}
function path(end=10){let a=+aR.value,b=+bR.value,d="";for(let i=0;i<=180;i++){let x=end*i/180,y=f(x,a,b),px=sx(x),py=sy(y);d+=`${i?"L":"M"}${px.toFixed(1)},${py.toFixed(1)} `;if(py<-100||py>600)break}return d}
function targetY(){let L=levels[level];return f(L.x,L.a,L.b)}
function update(){
 let a=+aR.value,b=+bR.value;
 document.getElementById("aOut").textContent=fmt(a);document.getElementById("bOut").textContent=fmt(b);
 let L=levels[level];
 document.getElementById("formula").innerHTML=L.onlyA
   ? `f(x)=${fmt(a)}<sup>x</sup>`
   : `f(x)=${fmt(b)}·${fmt(a)}<sup>x</sup>`;
 curve.setAttribute("d",path());startDot.setAttribute("cx",sx(0));startDot.setAttribute("cy",sy(b));
 if(!running){bird.setAttribute("transform",`translate(${sx(0)},${sy(b)})`);trail.setAttribute("d","")}
}
function dots(){let d=document.getElementById("dots");d.innerHTML="";levels.forEach((_,i)=>{let e=document.createElement("span");e.className="dot "+(i===level?"now":i<level?"done":"");d.appendChild(e)})}
function load(){
 if(raf)cancelAnimationFrame(raf);running=false;tries=0;triesEl.textContent="0";let L=levels[level];
 aR.value=L.startA;bR.value=L.startB;aR.disabled=!!L.lockA;bR.disabled=!!L.lockB;
 document.getElementById("aCard").classList.toggle("locked",!!L.lockA);
 document.getElementById("bCard").classList.toggle("locked",!!L.lockB);
 document.getElementById("bCard").classList.toggle("hidden",!!L.onlyA);
 document.getElementById("phase").textContent=L.phase;document.getElementById("taskText").textContent=L.task;
 document.getElementById("levelNo").textContent=level+1;document.getElementById("levelTotal").textContent=levels.length;
 target.setAttribute("transform",`translate(${sx(L.x)},${sy(targetY())})`);msg.textContent="Stelle den veränderbaren Parameter ein und starte den Vogel.";
 document.getElementById("prev").disabled=level===0;document.getElementById("next").disabled=level===levels.length-1;dots();update()
}
function fire(){
 if(running)return;running=true;shoot.disabled=true;tries++;triesEl.textContent=tries;let a=+aR.value,b=+bR.value,L=levels[level],ty=targetY(),start=performance.now(),hit=false;
 function frame(now){let p=Math.min(1,(now-start)/1400),x=10*p,y=f(x,a,b),px=sx(x),py=sy(y);bird.setAttribute("transform",`translate(${px},${py})`);trail.setAttribute("d",path(x));if(Math.hypot(px-sx(L.x),py-sy(ty))<30)hit=true;
 if(p<1&&py>-120&&py<620)raf=requestAnimationFrame(frame);else{running=false;shoot.disabled=false;let diff=f(L.x,a,b)-ty;msg.textContent=hit?"🎯 Treffer!":Math.abs(diff)<.35?"Knapp daneben.":"Daneben – passe den Parameter erneut an.";}}
 raf=requestAnimationFrame(frame)
}
aR.oninput=update;bR.oninput=update;shoot.onclick=fire;document.getElementById("reset").onclick=load;
document.getElementById("prev").onclick=()=>{if(level>0){level--;load()}};document.getElementById("next").onclick=()=>{if(level<levels.length-1){level++;load()}};
load()
})();
</script>
</body></html>
